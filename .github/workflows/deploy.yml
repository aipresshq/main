name: Deploy

# Code deployment is explicit. Article publishing writes runtime content directly
# and never invokes this workflow.
on:
  workflow_dispatch: {}

# Code releases queue rather than racing or cancelling a deployment in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Builds application code and Workers Assets. Runtime articles stay in D1/R2.
      - name: Build
        run: npm run build

      # Asserts against the built output, so it has to follow the build. A
      # deployment is exactly the wrong moment to skip the checks CI already runs.
      - name: Verify build output
        run: npm test

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
