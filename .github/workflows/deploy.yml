name: Deploy

# Fired by the "main" Worker's /api/prismic-webhook handler once it confirms a
# Prismic delivery is both authentic and represents real content going live
# (see src/lib/prismic-webhook.ts) — the build is static, so nothing in
# production reflects a Prismic change until this runs. workflow_dispatch is
# a manual fallback for the same sequence without needing a Prismic publish.
on:
  repository_dispatch:
    types: [prismic-publish]
  workflow_dispatch: {}

# A publish that lands mid-deploy should queue behind it, not race it or
# cancel it — cancelling a half-finished `wrangler deploy` is worse than a
# short wait.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The read-only Prismic loader needs no token, so this builds the real site.
      - name: Build
        run: npm run build

      # Asserts against the built output, so it has to follow the build. A
      # publish is exactly the wrong moment to skip the checks CI already runs.
      - name: Verify build output
        run: npm test

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
